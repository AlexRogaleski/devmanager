# Integração contínua do Dev Manager.
#
# Os alvos são os mesmos do Makefile, de propósito: o que roda aqui é o que
# você roda na sua máquina. CI que executa comandos próprios vira uma segunda
# definição de "está certo", e as duas divergem.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# O token começa somente-leitura. O job de release eleva para escrita, que é
# o mínimo para criar a Release — dar escrita ao workflow inteiro sairia de
# graça hoje e daria poder demais a qualquer passo acrescentado depois.
permissions:
  contents: read

# Um push novo cancela a execução anterior do mesmo branch: sem isso, uma
# sequência de commits enfileira builds que já nasceram obsoletos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A versão vem do go.mod, não fixada aqui. Duas fontes da verdade para
      # a versão do Go é como se descobre, meses depois, que o CI compila com
      # uma e o desenvolvimento com outra.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatação
        run: make fmt

      - name: Análise estática
        run: make vet

      - name: Testes
        run: make test

      # O detector de corrida precisa de cgo, e por isso não entra no alvo
      # padrão: numa máquina sem gcc ele falharia por motivo nenhum. No CI,
      # onde o gcc existe, ele é a única defesa automática contra as corridas
      # do supervisor e do anel de logs.
      - name: Detector de corrida
        run: make race

      - name: Compilação cruzada
        run: make cross

      # O binário publicado é estático: sem cgo ele não depende da glibc da
      # distro, que é o que permite rodar o mesmo arquivo num Fedora imutável,
      # num Ubuntu e num contêiner.
      - name: Binário estático
        run: make static

      - uses: actions/upload-artifact@v4
        with:
          name: devm-linux-amd64
          path: bin/devm
          if-no-files-found: error

  # O mesmo código num Mac de verdade.
  #
  # O binário de macOS é publicado a cada versão, e até aqui nunca tinha
  # rodado num: compilava pelo `make cross`, mas nenhum teste rodava lá. O
  # runner é Apple Silicon, então o darwin/arm64 sai testado; o darwin/amd64
  # continua só compilado.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Testes
        run: make test

      - name: Detector de corrida
        run: make race

      - name: Compilar
        run: make build

      # A suíte cobre a lógica; isto cobre o sistema. O runner tem sudo sem
      # senha, então o `devm setup --apply` configura /etc/resolver e o
      # Keychain de verdade, e o script confere pelos caminhos de um
      # navegador. Também baixa o PHP e o Node de macOS e confere os drivers
      # — os dois só tinham sido testados em Linux.
      - name: Verificação de ponta a ponta
        timeout-minutes: 10
        run: .github/scripts/verificar-macos.sh

  # Publicação: só em tag, e só depois de a suíte passar.
  #
  # O `needs` é o ponto: sem ele os jobs correriam em paralelo e uma tag
  # poderia publicar um binário reprovado nos testes, que é pior que não
  # publicar nada. Os dois sistemas precisam passar, porque os dois são
  # publicados.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verificar, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # A versão vem do nome da tag, e não do `git describe` que o Makefile
      # usa por padrão: o checkout do Actions é raso e não traz tags, então o
      # describe devolveria um hash — e a Release v0.1.0 conteria um binário
      # que se apresenta como "a3f2e1b" no `devm version`.
      - name: Compilar
        run: make release VERSION=${{ github.ref_name }}

      # As notas são escritas aqui, e não geradas pelo GitHub, por causa da
      # última linha: um binário compilado e não testado — hoje, o de macOS
      # Intel — precisa dizer isso a quem baixa.
      - name: Notas da versão
        run: |
          # O heredoc é CITADO ('FIM'), então o shell não interpreta nada do
          # que vem dentro. Isso não é preciosismo: o corpo é markdown, e
          # markdown usa backtick, que sem as aspas o shell leria como
          # substituição de comando — a tabela de arquivos saiu vazia
          # exatamente assim, numa versão anterior deste passo.
          #
          # A URL aparece duas vezes por isso. O ${{ github.ref_name }} não
          # precisa do shell: o Actions o substitui antes de o script rodar.
          cat > dist/NOTAS.md <<'FIM'
          Binário estático, sem dependências de sistema.

              curl -LO https://github.com/AlexRogaleski/devmanager/releases/download/${{ github.ref_name }}/devm-linux-amd64
              curl -LO https://github.com/AlexRogaleski/devmanager/releases/download/${{ github.ref_name }}/SHA256SUMS
              sha256sum -c --ignore-missing SHA256SUMS
              install -m 755 devm-linux-amd64 ~/.local/bin/devm
              devm setup

          A conferência do checksum está no meio da sequência, e não como
          passo opcional no fim, porque baixar um executável de 14 MB e
          instalá-lo sem verificar é o tipo de atalho que ninguém defende
          quando perguntado.

          | arquivo | plataforma |
          |---|---|
          | `devm-linux-amd64` | Linux x86-64 |
          | `devm-linux-arm64` | Linux ARM64 |
          | `devm-darwin-amd64` | macOS Intel |
          | `devm-darwin-arm64` | macOS Apple Silicon |

          O de macOS Apple Silicon passa pela suíte e por uma verificação
          de ponta a ponta num Mac a cada versão. O de macOS Intel é
          compilado, mas não testado.
          FIM

      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/devm-* dist/SHA256SUMS \
            --title "${{ github.ref_name }}" \
            --notes-file dist/NOTAS.md
